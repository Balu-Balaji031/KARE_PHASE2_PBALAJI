name: Add 10 Practice Problems Per Day

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  add-problems:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Append 10 related problems to every Day file
        shell: bash
        run: |
          set -e

          append_problems() {
            file="$1"
            shift
            {
              printf '\n\n'
              printf '%s\n' '// ============================================================'
              printf '%s\n' '// 10 ADDITIONAL PRACTICE PROBLEMS'
              printf '%s\n' '// ============================================================'
              i=1
              for problem in "$@"; do
                printf '// %d. %s\n' "$i" "$problem"
                i=$((i+1))
              done
            } >> "$file"
          }

          append_problems 'Day 1' \
            'Print a hollow rectangle of stars for R rows and C columns.' \
            'Print a right-aligned triangle of stars.' \
            'Print an inverted right-aligned triangle of stars.' \
            'Print a pyramid pattern of stars.' \
            'Print an inverted pyramid pattern of stars.' \
            'Print a diamond pattern of stars.' \
            'Print a hollow pyramid pattern.' \
            'Print a number triangle where each row contains the row number.' \
            'Print a 0-1 checkerboard pattern starting with 0.' \
            'Print a hollow square with both diagonals.'

          append_problems 'Day 2' \
            'Check whether a number is positive, negative, or zero using if-else.' \
            'Find the largest of two numbers using if-else.' \
            'Find the largest of three numbers using nested if-else.' \
            'Check whether a year is a leap year.' \
            'Check whether a character is a vowel or consonant.' \
            'Check whether a character is uppercase, lowercase, digit, or special character.' \
            'Check whether a person is eligible to vote and drive based on age.' \
            'Calculate a grade from marks using else-if conditions.' \
            'Check whether three sides can form a triangle.' \
            'Check whether a number is divisible by both 3 and 5.'

          append_problems 'day 3' \
            'Create a menu-driven calculator using switch.' \
            'Print the day of the week for a number 1-7 using switch.' \
            'Print the month name and number of days using switch.' \
            'Find whether a number is even or odd using switch.' \
            'Print numbers from 1 to N using a while loop.' \
            'Print numbers from N to 1 using a for loop.' \
            'Find the sum of numbers from 1 to N.' \
            'Print all even numbers in a given range.' \
            'Print all odd numbers in a given range.' \
            'Find the factorial of a number using a loop.'

          append_problems 'day 4' \
            'Print a solid square pattern of stars.' \
            'Print a left-aligned increasing triangle.' \
            'Print a left-aligned decreasing triangle.' \
            'Print a right-aligned increasing triangle.' \
            'Print a right-aligned decreasing triangle.' \
            'Print a hollow square pattern.' \
            'Print a hollow rectangle pattern.' \
            'Print a triangle containing increasing numbers.' \
            'Print a triangle containing decreasing numbers.' \
            'Print a square pattern where each row alternates between 0 and 1.'

          append_problems 'day 5' \
            'Print a centered star pyramid.' \
            'Print an inverted centered star pyramid.' \
            'Print a diamond star pattern.' \
            'Print an inverted diamond pattern.' \
            'Print a hollow diamond pattern.' \
            'Print a hollow pyramid with stars.' \
            'Print a butterfly star pattern.' \
            'Print a numeric pyramid with increasing values.' \
            'Print a palindromic number pyramid.' \
            'Print a 0-1 pyramid pattern.'

          append_problems 'day 6' \
            'Count the number of digits in an integer.' \
            'Find the sum of all digits of a number.' \
            'Find the product of all digits of a number.' \
            'Count the even and odd digits in a number.' \
            'Count how many digits are prime digits (2, 3, 5, 7).' \
            'Reverse an integer using arithmetic operations.' \
            'Check whether an integer is a palindrome.' \
            'Find the first and last digit of a number.' \
            'Find the largest digit in a number.' \
            'Find the smallest digit in a number.'

          append_problems 'day 7' \
            'Check whether a number is a Strong Number.' \
            'Check whether a number is an Armstrong Number.' \
            'Check whether a number is a Perfect Number.' \
            'Check whether a number is a Neon Number.' \
            'Check whether a number is a Spy Number.' \
            'Check whether two numbers are amicable.' \
            'Check whether a number is a Harshad Number.' \
            'Check whether a number is a Sunny Number.' \
            'Print all Armstrong numbers in a given range.' \
            'Print all perfect numbers in a given range.'

          append_problems 'day 8' \
            'Find the maximum element in an array.' \
            'Find the minimum element in an array.' \
            'Find the sum and average of array elements.' \
            'Count positive, negative, even, and odd elements in an array.' \
            'Replace an element at a given index.' \
            'Search for an element using linear search.' \
            'Reverse an array in place.' \
            'Copy all elements from one array to another.' \
            'Find the number of occurrences of a given value.' \
            'Print the array elements at even and odd indexes separately.'

          append_problems 'day 9' \
            'Find the element that occurs only once when every other element occurs twice.' \
            'Move all zeroes to the end while preserving the order of non-zero elements.' \
            'Move all zeroes to the beginning of the array.' \
            'Find the missing number from 1 to N.' \
            'Find duplicate elements in an array.' \
            'Find the intersection of two arrays.' \
            'Find the union of two arrays without duplicates.' \
            'Remove duplicate values from an array.' \
            'Find the first repeating element in an array.' \
            'Find the first non-repeating element in an array.'

          append_problems 'day 10' \
            'Read and print a 2D matrix.' \
            'Find the sum of all elements in a matrix.' \
            'Print the main and secondary diagonals of a square matrix.' \
            'Find the transpose of a matrix.' \
            'Find the sum of each row and each column.' \
            'Find the largest element in a matrix.' \
            'Count vowels and consonants in a string.' \
            'Reverse a string without using reverse().' \
            'Find the frequency of every character in a string.' \
            'Search for a target in a sorted array using binary search.'

          append_problems 'day 11' \
            'Implement binary search and return the target index.' \
            'Implement binary search recursively.' \
            'Find the first occurrence of a target in a sorted array.' \
            'Find the last occurrence of a target in a sorted array.' \
            'Count the occurrences of a target using binary search.' \
            'Implement bubble sort in ascending order.' \
            'Implement bubble sort in descending order.' \
            'Optimize bubble sort using a swapped flag.' \
            'Find the kth smallest element after sorting.' \
            'Sort an array and remove duplicate values.'

          append_problems 'Day 12' \
            'Create a single-inheritance example with Grandfather, Father, and Son.' \
            'Create a multilevel inheritance program.' \
            'Create a hierarchical inheritance program with one parent and two children.' \
            'Demonstrate method inheritance and call inherited methods.' \
            'Override a parent method in a child class.' \
            'Use super to call a parent class method.' \
            'Use super to access a parent class variable.' \
            'Create a constructor in a parent class and invoke it from a child class.' \
            'Create a practical inheritance example using Person, Student, and Teacher.' \
            'Demonstrate runtime method overriding with a parent reference and child object.'

          append_problems 'Day 13' \
            'Find the frequency of the maximum element in an array.' \
            'Left rotate an array by one position.' \
            'Right rotate an array by one position.' \
            'Find the second largest distinct element.' \
            'Find the second smallest distinct element.' \
            'Rotate an array by K positions.' \
            'Find the maximum difference between two array elements.' \
            'Move all negative numbers to one side of the array.' \
            'Find the majority element if it exists.' \
            'Find the pair of elements whose sum equals a given target.'

          append_problems 'Day 14(recursion)' \
            'Find the nth Fibonacci number using recursion.' \
            'Find the factorial of N using recursion.' \
            'Find the sum of numbers from 1 to N using recursion.' \
            'Find the sum of digits of a number using recursion.' \
            'Reverse a string using recursion.' \
            'Check whether a string is a palindrome using recursion.' \
            'Find the power x^n using recursion.' \
            'Find the greatest common divisor using recursion.' \
            'Create a parameterized constructor for a Student class.' \
            'Create a copy constructor and display copied object data.'

          append_problems 'Day 15(linked list)' \
            'Insert a node at the beginning of a singly linked list.' \
            'Insert a node at the end of a singly linked list.' \
            'Insert a node at a given position.' \
            'Delete the first node of a linked list.' \
            'Delete the last node of a linked list.' \
            'Delete a node by its value.' \
            'Find the length of a linked list.' \
            'Search for an element in a linked list.' \
            'Find the sum of all linked-list elements.' \
            'Reverse a singly linked list.'

          append_problems 'Day 16' \
            'Create an adjacency matrix for an undirected graph.' \
            'Create an adjacency list for an undirected graph.' \
            'Calculate the degree of every vertex.' \
            'Check whether two vertices are directly connected.' \
            'Count the number of edges in an undirected graph.' \
            'Perform Breadth First Search (BFS) from a given vertex.' \
            'Perform Depth First Search (DFS) from a given vertex.' \
            'Check whether a path exists between two vertices.' \
            'Count the connected components of an undirected graph.' \
            'Detect whether an undirected graph contains a cycle.'

          append_problems 'Day 17.java' \
            'Reverse a singly linked list iteratively.' \
            'Find the middle node of a singly linked list.' \
            'Find the nth node from the end of a singly linked list.' \
            'Remove duplicate values from a sorted linked list.' \
            'Merge two sorted singly linked lists.' \
            'Insert a node into a circular linked list at the beginning.' \
            'Insert a node into a circular linked list at the end.' \
            'Delete a node from a circular linked list by value.' \
            'Search for an element in a circular linked list.' \
            'Count the number of nodes in a circular linked list.'

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'Day 1' 'Day 2' 'day 3' 'day 4' 'day 5' 'day 6' 'day 7' 'day 8' 'day 9' 'day 10' 'day 11' 'Day 12' 'Day 13' 'Day 14(recursion)' 'Day 15(linked list)' 'Day 16' 'Day 17.java'
          git commit -m 'Add 10 topic-related practice problems to Day 1-17' || exit 0
          git push

      - name: Remove temporary workflow
        if: success()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/add_practice_problems.yml
          git add .github/workflows/add_practice_problems.yml
          git commit -m 'Remove temporary practice problem workflow' || exit 0
          git push
